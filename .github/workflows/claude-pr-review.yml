# Automatic PR review using the bug-hunter and documenter agents
# (.claude/agents/bug-hunter.md, .claude/agents/documenter.md).
#
# INACTIVE until you add the CLAUDE_CODE_OAUTH_TOKEN secret: generate it with
# `claude setup-token`. Runs bill against your Claude subscription quota, not
# pay-per-token API billing — confirmed at
# https://code.claude.com/docs/en/github-actions. It is tied to the account that
# ran `claude setup-token`; fine here since this is a personal repo. There is
# deliberately no API-key fallback: when the quota runs out, runs fail and post
# nothing — see docs/decisions/0002-cost-and-quota.md.
#
# Runs on every same-repo, non-draft PR (opened/synchronize/reopened/
# ready_for_review), not just on an
# `@claude review` comment: see docs/decisions/0002-cost-and-quota.md,
# which relaxes the old comment-only trigger now that the review runs on
# Haiku 5.5 at low effort — cheap enough per run that the per-push cost is
# acceptable against the shared subscription quota. The comment and manual
# triggers stay as a fallback. To bound that draw, draft PRs are skipped until
# marked ready, and a newer run on the same PR cancels the one in progress, so
# a burst of pushes costs one review, not one per push.
name: claude-pr-review

on:
  issue_comment:
    types: [created]
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.comment.author_association))
    # One live review per PR. Comments that don't ask for a review, or come from someone
    # who may not (and the manual trigger) get a unique group so they can never cancel a real one;
    # whether a job skipped by `if` joins its group is not documented, so this
    # doesn't depend on it.
    concurrency:
      group: >-
        ${{ (github.event_name == 'workflow_dispatch' ||
             (github.event_name == 'issue_comment' &&
              !(contains(github.event.comment.body, '@claude review') &&
                contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                         github.event.comment.author_association))))
            && github.run_id
            || format('claude-pr-review-{0}', github.event.pull_request.number || github.event.issue.number) }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # --allowedTools only adds approvals, and on pull_request runs the action
    # restores .claude/ from the base branch (restoreConfigFromBase), so the
    # repo's .claude/settings.json (unscoped Read/Grep/Glob, Edit, Write, git)
    # would still apply. `--setting-sources user` keeps project settings out;
    # the deny list also names the write/search/git tools (a deny wins).
    env:
      REVIEW_ARGS: >-
        --model claude-haiku-5-5 --effort low --setting-sources user
        --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Read(/${{ github.workspace }}/**)"
        --disallowedTools "Read(.git/**),Read(//proc/**),Read(//etc/**),Read(//run/**),Grep,Glob,Edit,Write,MultiEdit,NotebookEdit,Bash(git:*)"
      REVIEW_PROMPT: |
        Review pull request #${{ github.event.pull_request.number || github.event.issue.number }}
        of this repository (HEAD is detached, so use this number with
        `gh pr view`/`gh pr diff`; run commands from the repo root with
        relative paths, no `git -C`). Project agents and settings are not
        auto-loaded in this run: Read .claude/agents/bug-hunter.md and run a
        subagent that follows its instructions to review the change, using the
        severity definitions in .claude/skills/release-policy/SKILL.md. Then
        do the same with .claude/agents/documenter.md to check whether
        docs need updating for this change.
        In this run you can only read the code: you cannot write files,
        run tests (CI already runs them), or post to GitHub. The documenter reports only, and the
        bug-hunter reviews the diff without running the suite.
        Run the agents in the foreground and wait for their results: this
        is a non-interactive run that ends when you stop, so you must not
        end your turn while any agent is still running.
        Your FINAL message is posted verbatim as the PR comment by a later
        workflow step, so it must be the finished review and nothing else: no
        preamble, no status or progress text (never "I'm waiting for..." or
        "I posted..."). It must start with this exact first line:
        ## Review of PR #${{ github.event.pull_request.number || github.event.issue.number }}
        then the combined findings as Markdown (say so briefly if there are
        none), and it must end with this exact last line, with real counts
        (total = severe + non-severe, 0 when there are no findings):
        Result: <total> findings (<severe> severe, <non-severe> non-severe)
        (write "1 finding" instead of "1 findings" when the total is exactly 1)
        Between them, give one section per agent, titled "### bug-hunter" and
        "### documenter", and write the message only after both have reported.
        If you could not read the files you need, do not write a review: start
        your message with the line "REVIEW INCOMPLETE" and explain what was
        blocked. Never report "0 findings" for code you did not check.
        A final message without these parts is discarded as incomplete.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run bug-hunter and documenter review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's own token instead of the OIDC exchange for the
          # Claude GitHub App token, which needs `id-token: write` and the
          # app installed on the repo.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: ${{ env.REVIEW_ARGS }}
          prompt: ${{ env.REVIEW_PROMPT }}

      # An agent turn can end early with a progress message ("I'm waiting for
      # the agents...") and still exit green, so the result is checked before
      # it counts as a review (.github/scripts/check_review.py). One retry on
      # an incomplete result; if that is incomplete too, the next step fails
      # the job rather than posting it.
      - name: Check the review is complete
        id: check
        if: ${{ !cancelled() && steps.review.outcome == 'success' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"   # workflow_dispatch: nothing to post
          else
            rc=0
            python3 -I .github/scripts/check_review.py "$EXECUTION_FILE" "$PR_NUMBER" "$RUNNER_TEMP/review.md" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "valid=true" >> "$GITHUB_OUTPUT"
            elif [ "$rc" -eq 3 ]; then
              echo "valid=false" >> "$GITHUB_OUTPUT"
              echo "::warning::first review run was incomplete; retrying once"
            else
              # any other code (2, a crash, a missing script) is a setup error, not a bad review:
              # a retry would not help, so fail without spending another run.
              echo "::error::check_review.py failed (exit $rc): see its message above. Exit 2 is a setup or secret-leak stop; if the script is missing, copy .github/scripts/check_review.py into the repo."
              exit 1
            fi
          fi

      # Accepted limit (ADR 0002, "Known limits"): if the action ever posts a
      # comment per invocation, a retry could leave a second bot comment; none
      # were seen on this repo's runs, and re-checking is part of upgrading
      # the action.
      - name: Retry the review once (first result was incomplete)
        id: retry
        if: ${{ !cancelled() && steps.check.outputs.valid == 'false' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's own token instead of the OIDC exchange for the
          # Claude GitHub App token, which needs `id-token: write` and the
          # app installed on the repo.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: ${{ env.REVIEW_ARGS }}
          prompt: ${{ env.REVIEW_PROMPT }}

      # The agent has no write tools and no `gh pr comment`: its final message
      # is the review and this step posts it. That removes the "run gh with
      # arbitrary content" path, but not influence: an injected diff can still
      # make the review say anything (including "no findings"), and the
      # `@claude review` comment path also runs on fork PRs when a trusted user
      # asks for it. Treat the review as advisory. A workflow_dispatch run has
      # no PR number, so there is nothing to post to and it is skipped.
      # A review that is still incomplete here is not posted: the job fails so
      # the gap shows as a red check, and the only comment this step ever
      # posts is a finished review whose last line states the outcome. (The
      # action itself could add its own comments; none were seen on this
      # repo's runs.)
      # The gate script runs from the checkout. On a same-repo PR the author
      # can edit it, but they can already edit this workflow, so it grants
      # nothing new; fork PRs are skipped and the `@claude review` path checks
      # out the default branch.
      - name: Post the review
        if: ${{ !cancelled() && steps.review.outcome == 'success' && steps.check.outcome != 'failure' && (github.event.pull_request.number || github.event.issue.number) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          FIRST_FILE: ${{ steps.review.outputs.execution_file }}
          RETRY_FILE: ${{ steps.retry.outputs.execution_file }}
          RETRY_OUTCOME: ${{ steps.retry.outcome }}
        run: |
          if [ "$RETRY_OUTCOME" = "failure" ]; then
            echo "::error::the retry run failed; not posting its output"
            exit 1
          fi
          # If the retry ran, only its output counts: falling back to the
          # first (incomplete) file would discard a good retry silently.
          if [ "$RETRY_OUTCOME" = "success" ]; then
            EXECUTION_FILE="$RETRY_FILE"
          else
            EXECUTION_FILE="$FIRST_FILE"
          fi
          if ! python3 -I .github/scripts/check_review.py "$EXECUTION_FILE" "$PR_NUMBER" "$RUNNER_TEMP/review.md"; then
            echo "::error::the review run ended without a finished review; nothing posted"
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/review.md"

# Checked 2026-10-25 against the action's action.yml and the CLI reference: the
# inputs `claude_code_oauth_token`, `github_token`,
# `prompt`, `claude_args` and the `execution_file` output exist, `--effort` is
# a valid flag, and `claude-haiku-5-5` is a valid model id. Re-check them
# before relying on this workflow later; the action may have moved on. On
# 2026-11-08 the `env` expansion in `with:` and the `execution_file` output
# were also seen working on this repo's runs (docs/decisions/0002).
#
# To reuse this in a DIFFERENT repo: this file itself (project-specific CI)
# and .claude/agents/{bug-hunter,documenter}.md + .claude/skills/release-policy/
# must all be committed into that repo. A GitHub Actions runner only checks
# out the target repo, not your ~/.claude — user-scope install isn't visible
# to it. Run `python3 scripts/install.py --mode project --target <path-to-that-repo>`
# from this dotclaude repo to install the agents/skills there, then copy this
# workflow file in too, plus .github/scripts/check_review.py (without it the
# check step fails and no review is ever posted). `destaben/github-config`'s `apply.sh` automates the
# `CLAUDE_CODE_OAUTH_TOKEN` secret for every public repo tagged with the
# `github-config` topic, but not the agent/skill files or this workflow file
# itself — those still need `install.py --mode project` plus a manual copy
# per target repo.
