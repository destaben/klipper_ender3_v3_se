name: Print Rescue Tests

# config/printer.cfg is included because test_machine_profile.py checks that the
# profile's config_fingerprint still matches it.
"on":
  push:
    branches: [main]
    paths: ['print-rescue/**', 'config/printer.cfg', '.github/workflows/print-rescue-test.yml']
  pull_request:
    branches: [main]
    paths: ['print-rescue/**', 'config/printer.cfg', '.github/workflows/print-rescue-test.yml']

permissions:
  contents: read

jobs:
  unit-tests:
    name: print-rescue unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run unit tests
        run: python3 -m unittest discover -s print-rescue -v
