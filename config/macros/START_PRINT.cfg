[gcode_macro START_PRINT]
description: Start print
gcode:
    # Non-numeric values (an empty string or an unexpanded slicer placeholder) would become
    # 0 through |int and start the print cold. The range test is written as "not (in range)"
    # so that nan is rejected too. (Keep curly braces out of comments: Klipper templates them.)
    {% set bed_in = params.BED|default('')|trim|float(-1) %}
    {% set heater_in = params.HEATER|default('')|trim|float(-1) %}
    {% if not (bed_in >= 0 and bed_in <= 400 and heater_in >= 0 and heater_in <= 400) %}
        { action_raise_error("START_PRINT requires numeric BED and HEATER parameters between 0 and 400") }
    {% endif %}
    CANCEL_PRINTER_SHUTDOWN ; Do not let a pending auto power-off interrupt this print
    MMU_MODE QUIET=1 ; Warn if the MMU is simulated (tool changes T1-T5 will fail)
    {% set bed_temp = params.BED|int %}
    {% set heater_temp = params.HEATER|int %}
    M140 S{bed_temp} ; Set bed temperature
    M190 S{bed_temp} ; Wait for bed temp to stabilize
    G28 ; Home all axes
    CLEAR_PAUSE
    BED_MESH_PROFILE LOAD=default
    ;BED_MESH_CALIBRATE ADAPTIVE=1 ; Calibrar malla adaptativa

    M104 S{heater_temp} ; Set nozzle temperature
    G92 E0 ; Reset Extruder
    G1 Z5.0 F3000 ; Move Z Axis up to avoid dragging while heating

    G1 X20 Y20 Z0.5 F5000.0 ; Move to start position

    M109 S{heater_temp} ; Wait for nozzle temp to stabilize

    LINE_PURGE ; KAMP line purge