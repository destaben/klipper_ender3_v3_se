# Extruder Jam Detection via TMC2209 StallGuard
#
# This macro periodically reads the extruder TMC2209 driver load (SG_RESULT)
# and pauses the print if the value indicates a jam or filament grinding.
#
# SG_RESULT ranges from 0 (high load / stall) to 510 (no load).
# A low SG_RESULT during extrusion indicates the motor is working harder
# than expected — likely due to a clog, jam, or filament grinding.
#
# Tuning:
#   1. Print normally and run QUERY_TMC_LOAD periodically to observe baseline values
#   2. The default threshold (sg_threshold) is 20 — lower = more sensitive
#   3. Adjust via: SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=sg_threshold VALUE=30
#   4. check_interval controls seconds between checks (default: 2)
#   5. min_consecutive_fails controls how many consecutive low readings before pausing (default: 3)

[gcode_macro _JAM_DETECTION_VARS]
variable_sg_threshold: 20
variable_check_interval: 2
variable_min_consecutive_fails: 3
variable_consecutive_fails: 0
variable_enabled: 0
gcode:
    # Storage macro — no direct gcode action

[gcode_macro ENABLE_JAM_DETECTION]
description: Start periodic extruder jam detection
gcode:
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE=0
    RESPOND MSG="Extruder jam detection ENABLED (threshold={printer['gcode_macro _JAM_DETECTION_VARS'].sg_threshold})"
    _CHECK_EXTRUDER_LOAD

[gcode_macro DISABLE_JAM_DETECTION]
description: Stop periodic extruder jam detection
gcode:
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=enabled VALUE=0
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE=0
    RESPOND MSG="Extruder jam detection DISABLED"

[gcode_macro _CHECK_EXTRUDER_LOAD]
description: Internal macro — periodically checks extruder TMC load
gcode:
    {% set vars = printer['gcode_macro _JAM_DETECTION_VARS'] %}
    {% if vars.enabled == 1 %}
        {% set sg_result = printer['tmc2209 extruder'].drv_status.sg_result | default(255) %}
        {% set threshold = vars.sg_threshold | int %}
        {% set fails = vars.consecutive_fails | int %}
        {% set min_fails = vars.min_consecutive_fails | int %}

        {% if sg_result < threshold %}
            {% set new_fails = fails + 1 %}
            SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE={new_fails}
            {% if new_fails >= min_fails %}
                RESPOND TYPE=error MSG="EXTRUDER JAM DETECTED! SG_RESULT={sg_result} (threshold={threshold}, consecutive={new_fails})"
                PAUSE
                SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=enabled VALUE=0
            {% else %}
                RESPOND MSG="Extruder load warning: SG_RESULT={sg_result} ({new_fails}/{min_fails})"
            {% endif %}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE=0
        {% endif %}

        # Schedule next check
        {% if vars.enabled == 1 %}
            UPDATE_DELAYED_GCODE ID=_jam_detection_loop DURATION={vars.check_interval}
        {% endif %}
    {% endif %}

[delayed_gcode _jam_detection_loop]
gcode:
    _CHECK_EXTRUDER_LOAD

[gcode_macro QUERY_TMC_LOAD]
description: Display current extruder TMC2209 StallGuard load value
gcode:
    {% set sg_result = printer['tmc2209 extruder'].drv_status.sg_result | default(-1) %}
    RESPOND MSG="Extruder SG_RESULT: {sg_result}"

[gcode_macro SET_JAM_THRESHOLD]
description: Set the StallGuard threshold for jam detection
gcode:
    {% set threshold = params.VALUE | default(20) | int %}
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=sg_threshold VALUE={threshold}
    RESPOND MSG="Jam detection threshold set to {threshold}"
