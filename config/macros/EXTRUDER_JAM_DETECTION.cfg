# Extruder Jam Detection via TMC2209 StallGuard
#
# This macro periodically reads the extruder TMC2209 driver load (SG_RESULT)
# and reports when the value indicates a jam or filament grinding.
#
# SG_RESULT ranges from 0 (high load / stall) to 510 (no load).
# A low SG_RESULT during extrusion indicates the motor is working harder
# than expected — likely due to a clog, jam, or filament grinding.
#
# Modes:
#   monitor (default) — logs warnings only, never pauses
#   pause             — pauses the print after N consecutive fails
#
# After a filament change, call FILAMENT_CHANGE_DONE to enter a burst-check
# window (faster polling for a configurable duration) so stuck filament is
# detected quickly.
#
# Tuning:
#   1. Print normally and run QUERY_TMC_LOAD periodically to observe baseline values
#   2. The default threshold (sg_threshold) is 20 — lower = more sensitive
#   3. Adjust via: SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=sg_threshold VALUE=30
#   4. check_interval controls seconds between checks (default: 2)
#   5. min_consecutive_fails controls how many consecutive low readings before acting (default: 3)
#   6. post_change_interval controls burst-check interval after filament change (default: 0.5s)
#   7. post_change_duration controls how long the burst-check window lasts (default: 30s)

[gcode_macro _JAM_DETECTION_VARS]
variable_sg_threshold: 20
variable_check_interval: 2
variable_min_consecutive_fails: 3
variable_consecutive_fails: 0
variable_enabled: 0
# Mode: "monitor" = log only, "pause" = pause print on jam
variable_mode: "monitor"
# Post-filament-change burst checking
variable_post_change_interval: 0.5
variable_post_change_duration: 30
variable_post_change_active: 0
# Planned: will store the monotonic end time for burst-check window (not yet used)
variable_post_change_end_time: 0
# Future remediation hook — name of a macro to call on jam (empty = disabled)
variable_remediation_macro: ""
gcode:
    # Storage macro — no direct gcode action

[gcode_macro ENABLE_JAM_DETECTION]
description: Start periodic extruder jam detection
gcode:
    {% set mode = params.MODE | default("monitor") | lower %}
    {% if mode not in ["monitor", "pause"] %}
        RESPOND TYPE=error MSG="Invalid mode '{mode}'. Use 'monitor' or 'pause'."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=enabled VALUE=1
        SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE=0
        SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=mode VALUE="'{mode}'"
        RESPOND MSG="Extruder jam detection ENABLED (mode={mode}, threshold={printer['gcode_macro _JAM_DETECTION_VARS'].sg_threshold})"
        _CHECK_EXTRUDER_LOAD
    {% endif %}

[gcode_macro DISABLE_JAM_DETECTION]
description: Stop periodic extruder jam detection
gcode:
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=enabled VALUE=0
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE=0
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=post_change_active VALUE=0
    RESPOND MSG="Extruder jam detection DISABLED"

[gcode_macro FILAMENT_CHANGE_DONE]
description: Signal that a filament change completed — enables burst-check mode for faster jam detection
gcode:
    {% set vars = printer['gcode_macro _JAM_DETECTION_VARS'] %}
    {% set duration = params.DURATION | default(vars.post_change_duration) | float %}
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=post_change_active VALUE=1
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE=0
    RESPOND MSG="Jam detection: burst-check mode ACTIVE for {duration}s (interval={vars.post_change_interval}s)"
    # Schedule the end of burst mode
    UPDATE_DELAYED_GCODE ID=_jam_burst_end DURATION={duration}
    # If detection is already running the loop will pick up the faster interval;
    # if not, start it now.
    {% if vars.enabled == 0 %}
        SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=enabled VALUE=1
        _CHECK_EXTRUDER_LOAD
    {% endif %}

[delayed_gcode _jam_burst_end]
gcode:
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=post_change_active VALUE=0
    RESPOND MSG="Jam detection: burst-check mode ended, returning to normal interval"

[gcode_macro _CHECK_EXTRUDER_LOAD]
description: Internal macro — periodically checks extruder TMC load
gcode:
    {% set vars = printer['gcode_macro _JAM_DETECTION_VARS'] %}
    {% if vars.enabled == 1 %}
        {% set sg_result = printer['tmc2209 extruder'].drv_status.sg_result | default(255) %}
        {% set threshold = vars.sg_threshold | int %}
        {% set fails = vars.consecutive_fails | int %}
        {% set min_fails = vars.min_consecutive_fails | int %}
        {% set mode = vars.mode %}

        {% if sg_result < threshold %}
            {% set new_fails = fails + 1 %}
            SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE={new_fails}
            {% if new_fails >= min_fails %}
                {% if mode == "pause" %}
                RESPOND TYPE=error MSG="EXTRUDER JAM DETECTED! SG_RESULT={sg_result} (threshold={threshold}, consecutive={new_fails}, mode={mode})"
                {% else %}
                RESPOND MSG="EXTRUDER JAM DETECTED (monitor): SG_RESULT={sg_result} (threshold={threshold}, consecutive={new_fails})"
                {% endif %}
                {% if mode == "pause" %}
                    PAUSE
                    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=enabled VALUE=0
                {% elif vars.remediation_macro != "" %}
                    # Future: call remediation macro
                    RESPOND MSG="Jam detection: remediation hook '{vars.remediation_macro}' would fire here (not yet implemented)"
                {% endif %}
                # In monitor mode, reset counter and keep watching
                {% if mode == "monitor" %}
                    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE=0
                {% endif %}
            {% else %}
                RESPOND MSG="Extruder load warning: SG_RESULT={sg_result} ({new_fails}/{min_fails})"
            {% endif %}
        {% else %}
            SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=consecutive_fails VALUE=0
        {% endif %}

        # Schedule next check — use faster interval during post-change burst
        {% if vars.enabled == 1 %}
            {% if vars.post_change_active == 1 %}
                UPDATE_DELAYED_GCODE ID=_jam_detection_loop DURATION={vars.post_change_interval}
            {% else %}
                UPDATE_DELAYED_GCODE ID=_jam_detection_loop DURATION={vars.check_interval}
            {% endif %}
        {% endif %}
    {% endif %}

[delayed_gcode _jam_detection_loop]
gcode:
    _CHECK_EXTRUDER_LOAD

[gcode_macro QUERY_TMC_LOAD]
description: Display current extruder TMC2209 StallGuard load value
gcode:
    {% set sg_result = printer['tmc2209 extruder'].drv_status.sg_result | default(-1) %}
    RESPOND MSG="Extruder SG_RESULT: {sg_result}"

[gcode_macro SET_JAM_THRESHOLD]
description: Set the StallGuard threshold for jam detection
gcode:
    {% set threshold = params.VALUE | default(20) | int %}
    SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=sg_threshold VALUE={threshold}
    RESPOND MSG="Jam detection threshold set to {threshold}"

[gcode_macro SET_JAM_MODE]
description: Set jam detection mode (monitor or pause)
gcode:
    {% set mode = params.MODE | default("monitor") | lower %}
    {% if mode not in ["monitor", "pause"] %}
        RESPOND TYPE=error MSG="Invalid mode '{mode}'. Use 'monitor' or 'pause'."
    {% else %}
        SET_GCODE_VARIABLE MACRO=_JAM_DETECTION_VARS VARIABLE=mode VALUE="'{mode}'"
        RESPOND MSG="Jam detection mode set to: {mode}"
    {% endif %}

