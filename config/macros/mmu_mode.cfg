# Real or simulated Pico MMU. See docs/virtual-mmu.md.
#
# With the optional mmu-fallback sidecar, [mcu PICO_MMU] may be backed by a
# virtual MCU (a "linux" process) when the real Pico is not plugged in. Klipper
# reports the firmware it is talking to, so no state needs to be passed in:
# the MCU is "linux" when virtual and e.g. "stm32g0b1xx" when real.

[gcode_macro MMU_MODE]
description: Report whether the Pico MMU is real or simulated. QUIET=1 only reports the simulated case
gcode:
  {% set virtual = printer["mcu PICO_MMU"].mcu_constants.MCU == "linux" %}
  {% if virtual %}
    RESPOND TYPE=error MSG="MMU: SIMULATED (virtual MCU). Tool changes T1-T5 are disabled."
  {% elif params.QUIET|default(0)|int == 0 %}
    RESPOND MSG="MMU: REAL"
  {% endif %}

# Stops tool changes that need the real MMU. T0 stays allowed: it is the
# single-filament case.
[gcode_macro _MMU_REQUIRE_REAL]
description: Raise an error when the MMU is simulated and LANE is not 0
gcode:
  {% set lane = params.LANE|default(0)|int %}
  {% if lane != 0 and printer["mcu PICO_MMU"].mcu_constants.MCU == "linux" %}
    { action_raise_error("MMU is simulated (no real Pico connected): cannot change to T%d" % lane) }
  {% endif %}

# Announce the mode after every (re)start, so a restart triggered by the
# sidecar shows up in the console.
[delayed_gcode _MMU_MODE_ANNOUNCE]
initial_duration: 5
gcode:
  MMU_MODE
