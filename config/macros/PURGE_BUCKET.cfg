[gcode_macro PURGE_BUCKET]
description: Move to purge bucket and purge filament, then wipe nozzle
variable_bucket_x: 10
variable_bucket_y: 10
variable_bucket_z: 5
variable_purge_amount: 40
variable_purge_speed: 300
variable_wipe_enabled: 1
variable_wipe_strokes: 4
variable_wipe_length: 15
variable_wipe_speed: 3000
variable_z_lift: 10
variable_travel_speed: 6000
variable_min_temp: 180
variable_retract_length: 0.5
variable_retract_speed: 2400
gcode:
    {% set bucket_x = printer["gcode_macro PURGE_BUCKET"].bucket_x | float %}
    {% set bucket_y = printer["gcode_macro PURGE_BUCKET"].bucket_y | float %}
    {% set bucket_z = printer["gcode_macro PURGE_BUCKET"].bucket_z | float %}
    {% set purge_amount = printer["gcode_macro PURGE_BUCKET"].purge_amount | float %}
    {% set purge_speed = printer["gcode_macro PURGE_BUCKET"].purge_speed | float %}
    {% set wipe_enabled = printer["gcode_macro PURGE_BUCKET"].wipe_enabled | int %}
    {% set wipe_strokes = printer["gcode_macro PURGE_BUCKET"].wipe_strokes | int %}
    {% set wipe_length = printer["gcode_macro PURGE_BUCKET"].wipe_length | float %}
    {% set wipe_speed = printer["gcode_macro PURGE_BUCKET"].wipe_speed | float %}
    {% set z_lift = printer["gcode_macro PURGE_BUCKET"].z_lift | float %}
    {% set travel_speed = printer["gcode_macro PURGE_BUCKET"].travel_speed | float %}
    {% set min_temp = printer["gcode_macro PURGE_BUCKET"].min_temp | float %}
    {% set retract_length = printer["gcode_macro PURGE_BUCKET"].retract_length | float %}
    {% set retract_speed = printer["gcode_macro PURGE_BUCKET"].retract_speed | float %}

    {% set current_temp = printer.extruder.temperature | float %}

    {% if current_temp < min_temp %}
        {action_respond_info("PURGE_BUCKET: Nozzle temp %.1f°C is below minimum %.1f°C. Aborting." % (current_temp, min_temp))}
    {% else %}
        SAVE_GCODE_STATE NAME=purge_bucket_state

        G90                                         ; Absolute positioning
        G91                                         ; Relative for Z lift
        G1 Z{z_lift} F{travel_speed}                ; Safe Z lift
        G90                                         ; Back to absolute

        G1 X{bucket_x} Y{bucket_y} F{travel_speed} ; Move to bucket XY
        G1 Z{bucket_z} F{travel_speed}              ; Lower to purge height

        M83                                         ; Relative extrusion
        G1 E{purge_amount} F{purge_speed}           ; Purge filament

        {% if wipe_enabled %}
            {% for i in range(wipe_strokes) %}
                G1 X{bucket_x + wipe_length} F{wipe_speed}
                G1 X{bucket_x} F{wipe_speed}
            {% endfor %}
        {% endif %}

        G1 E-{retract_length} F{retract_speed}     ; Retract

        G91                                         ; Relative for Z lift
        G1 Z{z_lift} F{travel_speed}                ; Raise Z
        G90                                         ; Back to absolute

        RESTORE_GCODE_STATE NAME=purge_bucket_state

        {action_respond_info("PURGE_BUCKET: Purge complete.")}
    {% endif %}
