; Monitor the hotend cooling fan after a print finishes and power off the
; printer via the Moonraker Home Assistant switch once the fan stops and an
; additional 5-minute cool-down period has elapsed.
;
; Usage
;   PRINTER_SHUTDOWN        – start the shutdown sequence (called from END_PRINT)
;   CANCEL_PRINTER_SHUTDOWN – abort a pending shutdown

[gcode_macro PRINTER_SHUTDOWN]
description: Schedule printer power-off after the hotend fan stops
gcode:
  M117 Shutdown scheduled...
  UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_CHECK DURATION=60

[gcode_macro CANCEL_PRINTER_SHUTDOWN]
description: Cancel a pending printer shutdown
gcode:
  UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_CHECK DURATION=0
  UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_EXECUTE DURATION=0
  M117 Shutdown cancelled

; Poll the hotend fan every 60 s.  Once it is off, start the 5-min countdown.
[delayed_gcode _PRINTER_SHUTDOWN_CHECK]
gcode:
  {% if printer['heater_fan hotend_fan'].speed > 0 %}
    M117 Cooling... {printer.extruder.temperature|int}C
    UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_CHECK DURATION=60
  {% else %}
    M117 Fan off - shutdown in 5 min
    UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_EXECUTE DURATION=300
  {% endif %}

; Power off via Moonraker's Home Assistant switch after the countdown.
[delayed_gcode _PRINTER_SHUTDOWN_EXECUTE]
gcode:
  M117 Powering off...
  {action_call_remote_method("set_device_power", device="printer", state="off")}
