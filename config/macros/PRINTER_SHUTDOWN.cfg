; Monitor the hotend cooling fan after a print finishes and power off the
; printer via the Moonraker Home Assistant switch once the fan stops and an
; additional 5-minute cool-down period has elapsed.
;
; Pending SAVE_CONFIG changes (Klipper's save_config_pending, e.g. from a
; calibration) are saved before the power-off. SAVE_CONFIG restarts Klipper,
; which discards the running countdown, so the power-off is handed over through
; the flag shutdown_after_save: _PRINTER_SHUTDOWN_RESUME runs 30 s after the
; restart, clears the flag and powers off, but only if Klipper is ready. Run
; CANCEL_PRINTER_SHUTDOWN within those 30 s to keep the printer on. The flag lives
; in [save_variables], which is defined in config/macros/sp_mmu.cfg (~line 77);
; this file needs that section.
;
; Stale flag: the flag is set before SAVE_CONFIG runs. If SAVE_CONFIG fails, or the
; restart after it never reaches ready (for example a config error), the flag
; stays set and the next successful start powers the printer off 30 s after
; ready. Klipper has no wall clock, so the flag cannot expire. A manual restart
; (e.g. FIRMWARE_RESTART) inside the 30 s window re-arms the timer, so run
; CANCEL_PRINTER_SHUTDOWN again after it to stay on. To drop the flag by hand run:
;   SAVE_VARIABLE VARIABLE=shutdown_after_save VALUE=0
; (or CANCEL_PRINTER_SHUTDOWN, which also clears it).
; SAVE_CONFIG never runs while a print is printing or paused, or while the
; hotend or bed target is above 0 (the restart would switch the heaters off).
;
; Usage
;   PRINTER_SHUTDOWN        – start the shutdown sequence (called from END_PRINT)
;   CANCEL_PRINTER_SHUTDOWN – abort a pending shutdown, including a save-and-power-off
;                             that is waiting for the restart (called from START_PRINT)

[gcode_macro PRINTER_SHUTDOWN]
description: Schedule printer power-off after the hotend fan stops
gcode:
  M117 Shutdown scheduled...
  UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_CHECK DURATION=60

[gcode_macro CANCEL_PRINTER_SHUTDOWN]
description: Cancel a pending printer shutdown
gcode:
  {% set sv_vars = (printer.save_variables if printer.save_variables is defined else {}).variables | default({}) %}
  UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_CHECK DURATION=0
  UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_EXECUTE DURATION=0
  UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_RESUME DURATION=0
  {% if (sv_vars.shutdown_after_save | default(0) | int) == 1 %}
    SAVE_VARIABLE VARIABLE=shutdown_after_save VALUE=0
  {% endif %}
  M117 Shutdown cancelled

; Shared power-off step, used by the countdown and by the post-save resume. The
; busy guard is repeated here so that either caller is safe on its own.
[gcode_macro _PRINTER_POWER_OFF]
description: Power off the printer via Moonraker unless a print is running or a heater is on
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] or printer.extruder.target > 0 or printer.heater_bed.target > 0 %}
    M117 Shutdown aborted: printer busy
  {% else %}
    M117 Powering off...
    {action_call_remote_method("set_device_power", device="printer", state="off")}
  {% endif %}

; Poll the hotend fan every 60 s.  Once it is off, start the 5-min countdown.
[delayed_gcode _PRINTER_SHUTDOWN_CHECK]
gcode:
  {% if printer['heater_fan hotend_fan'].speed > 0 %}
    M117 Cooling... {printer.extruder.temperature|int}C
    UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_CHECK DURATION=60
  {% else %}
    M117 Fan off - shutdown in 5 min
    UPDATE_DELAYED_GCODE ID=_PRINTER_SHUTDOWN_EXECUTE DURATION=300
  {% endif %}

; Countdown finished. Re-check before anything else: a print started during the
; countdown (without START_PRINT, which would cancel it) must not be cut off.
; If config changes are pending, save them first; the power-off is then done by
; _PRINTER_SHUTDOWN_RESUME after the restart. Nothing may run after SAVE_CONFIG.
[delayed_gcode _PRINTER_SHUTDOWN_EXECUTE]
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] or printer.extruder.target > 0 or printer.heater_bed.target > 0 %}
    M117 Shutdown aborted: printer busy
  {% elif printer.configfile.save_config_pending %}
    M117 Saving config...
    SAVE_VARIABLE VARIABLE=shutdown_after_save VALUE=1
    SAVE_CONFIG
  {% else %}
    _PRINTER_POWER_OFF
  {% endif %}

; Runs 30 s after every klippy:ready event. Does nothing unless the flag is set by an
; EXECUTE that saved config. The flag is cleared before the power-off so a
; failure cannot repeat it. The power-off only happens while Klipper is ready, so
; a fault right after the restart stays visible. _PRINTER_POWER_OFF checks the
; busy state again. The power-off is a single request to Moonraker and is not
; retried: if Moonraker is not yet connected 30 s after ready the printer stays on
; (the safe direction) and the flag is already cleared.
[delayed_gcode _PRINTER_SHUTDOWN_RESUME]
initial_duration: 30
gcode:
  {% set sv_vars = (printer.save_variables if printer.save_variables is defined else {}).variables | default({}) %}
  {% if (sv_vars.shutdown_after_save | default(0) | int) == 1 %}
    SAVE_VARIABLE VARIABLE=shutdown_after_save VALUE=0
    {% if printer.webhooks.state == "ready" %}
      M117 Config saved - requesting power-off...
      _PRINTER_POWER_OFF
    {% else %}
      M117 Power-off skipped: Klipper not ready
    {% endif %}
  {% endif %}
