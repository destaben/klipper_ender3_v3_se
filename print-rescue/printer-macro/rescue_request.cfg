# print-rescue: request-only Klipper macro (issue #115). OPT-IN: this file is deliberately NOT under config/macros/, which
# printer.cfg includes by glob. Nothing here is active until the owner copies it to the printer and adds
#     [include macros/rescue_request.cfg]
# (or pastes it into printer.cfg) and restarts Klippy.
#
# What it does: bumps a counter and a stamp that a worker polls (GET /printer/objects/query?gcode_macro RESCUE_REQUEST) and
# prints one line in the console. That is all. It does no motion, no heating, no restart and no file or shell access, and it starts
# nothing: the worker only PREPARES a plan and then waits for a human to type a confirmation at the worker. See
# docs/print-rescue-worker.md.
#
# Limits, by design:
# - Klippy in "shutdown" cannot run macros. The button works only after the operator has brought Klippy back to "ready".
#   The evidence is therefore kept continuously by the worker's log keeper, not captured by this button.
# - The counter lives in Klippy's memory and resets to 0 on a Klippy restart. The stamp (print time at the press) tells a new
#   press apart from an old one with the same counter value.
# - It records a request only when print_stats is "standby". A running, paused, errored, cancelled or complete job is refused, so a
#   stray tap cannot create a request in the middle of a job (the worker checks the same again before confirming).

[gcode_macro RESCUE_REQUEST]
description: Ask the worker to PREPARE a print rescue plan. Records a request only. No motion.
variable_seq: 0
variable_stamp: 0.0
gcode:
  {% if printer.print_stats.state != "standby" %}
    RESPOND TYPE=error MSG="RESCUE_REQUEST refused: print state is not standby"
  {% else %}
    SET_GCODE_VARIABLE MACRO=RESCUE_REQUEST VARIABLE=seq VALUE={printer["gcode_macro RESCUE_REQUEST"].seq + 1}
    SET_GCODE_VARIABLE MACRO=RESCUE_REQUEST VARIABLE=stamp VALUE={printer.toolhead.estimated_print_time|round(3)}
    RESPOND MSG="RESCUE_REQUEST recorded. Nothing moves. The worker prepares a plan; a person must confirm it at the worker."
  {% endif %}
