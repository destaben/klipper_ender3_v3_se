services:
  traefik:
    image: traefik:3.6
    restart: unless-stopped
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 128M

  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:v2.12.0
    restart: unless-stopped
    container_name: mainsail
    labels:
      traefik.enable: true
      traefik.http.services.mainsail.loadbalancer.server.port: 80
      traefik.http.routers.mainsail.rule: PathPrefix(`/`)
      traefik.http.routers.mainsail.entrypoints: web
      traefik.http.routers.mainsail.middlewares: mainsail-ratelimit
      traefik.http.middlewares.mainsail-ratelimit.ratelimit.average: 5
      traefik.http.middlewares.mainsail-ratelimit.ratelimit.burst: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
    depends_on: [moonraker]

  klipper:
    image: ghcr.io/destaben/klipper_ender3_v3_se/klipper:sha-44871ed
    build:
      context: .
      dockerfile: Dockerfile-klipper
    restart: unless-stopped
    container_name: klipper
    privileged: true
    command:
      - /home/klipper/klippy-env/bin/python
      - /home/klipper/klipper/klippy/klippy.py
      - /opt/printer_data/config/printer.cfg
      - -a
      - /opt/printer_data/config/klippy_uds
    volumes:
      - /dev:/dev
      # Klipper configuration
      - ./config:/opt/printer_data/config
      - ./gcodes:/opt/printer_data/gcodes
      # Maintenance script
      - ./KlipperMaintenance/maintain.py:/home/klipper/klipper/klippy/extras/maintain.py
      # Chopper Resonance Tuner configuration
      - ./chopper-resonance-tuner/gcode_shell_command.py:/home/klipper/klipper/klippy/extras/gcode_shell_command.py
      - ./chopper-resonance-tuner:/home/klipper/chopper-resonance-tuner
      # Stable serial path for the Pico MMU (default: symlink to the real device).
      # The mmu-fallback profile can point it at a virtual MCU, see docs/virtual-mmu.md.
      - ${MMU_LINK_DIR:-./serial-links}:/run/klipper:ro
    depends_on:
      # Ignored unless the mmu-fallback profile is enabled
      mmu-fallback:
        condition: service_healthy
        required: false
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  moonraker:
    image: ghcr.io/destaben/klipper_ender3_v3_se/moonraker:sha-44871ed
    build:
      context: .
      dockerfile: Dockerfile-moonraker
    restart: unless-stopped
    container_name: moonraker
    pid: host
    labels:
      traefik.enable: true
      traefik.http.services.moonraker.loadbalancer.server.port: 7125
      traefik.http.routers.moonraker.rule: PathRegexp(`^/(websocket|printer|api|access|machine|server)`)
      traefik.http.routers.moonraker.entrypoints: web
      traefik.http.routers.moonraker.middlewares: moonraker-ratelimit
      traefik.http.middlewares.moonraker-ratelimit.ratelimit.average: 20
      traefik.http.middlewares.moonraker-ratelimit.ratelimit.burst: 40
    volumes:
      - /run/systemd:/run/systemd
      - /run/dbus:/run/dbus
      # Moonraker configuration
      - ./config:/opt/printer_data/config
      - type: bind
        source: ./config/moonraker.secrets
        target: /opt/printer_data/moonraker.secrets
        read_only: true
        bind:
          create_host_path: false
      - ./moonraker/database:/opt/printer_data/database
      - ./moonraker/logs:/opt/printer_data/logs
      - ./gcodes:/opt/printer_data/gcodes
      # Timelapse configuration
      - ./moonraker-timelapse/component/timelapse.py:/opt/moonraker/moonraker/components/timelapse.py
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M

  klipper-connect:
    # Pinned to the image CI published for that commit. After changing
    # Dockerfile-klipper-connect, bump to the new sha-<short> tag once it merges,
    # or test first with `docker compose build klipper-connect`.
    image: ghcr.io/destaben/klipper_ender3_v3_se/klipper-connect:sha-80f16e6
    build:
      context: .
      dockerfile: Dockerfile-klipper-connect
    # Opt-in. A plain `docker compose up -d` skips this service, so the rest of
    # the stack still starts before config/klipper_connect.conf exists. Start it
    # by name: `docker compose up -d klipper-connect`.
    profiles: ["prusa-connect"]
    restart: unless-stopped
    container_name: klipper-connect
    depends_on: [moonraker]
    # Hardening: the bridge writes only to its two bind mounts and /tmp.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # Bridge configuration, read-only. Compose fails instead of creating a directory if the file is missing.
      - type: bind
        source: ./config/klipper_connect.conf
        target: /data/config/klipper_connect.conf
        read_only: true
        bind:
          create_host_path: false
      # Prusa Connect token and job state (klipper_connect/ under data_dir)
      - ./klipper-connect:/data/klipper_connect
      # G-code files, shared with moonraker
      - ./gcodes:/data/gcodes
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # Estimate, to be tuned: too low risks an OOM kill during large uploads.
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Written by scripts/rpi-metrics.sh (user crontab, see setup_services.sh).
      - ./textfile:/textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.textfile.directory=/textfile'
    labels:
      traefik.enable: true
      traefik.http.services.nodeexporter.loadbalancer.server.port: 9100
      traefik.http.routers.nodeexporter.rule: PathPrefix(`/nodeexporter`)
      traefik.http.routers.nodeexporter.entrypoints: web
      traefik.http.routers.nodeexporter.middlewares: nodeexporter-stripprefix,nodeexporter-ratelimit
      traefik.http.middlewares.nodeexporter-stripprefix.stripprefix.prefixes: /nodeexporter
      traefik.http.middlewares.nodeexporter-ratelimit.ratelimit.average: 1
      traefik.http.middlewares.nodeexporter-ratelimit.ratelimit.burst: 2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: cadvisor
    restart: unless-stopped
    command:
      - '-housekeeping_interval=10s'
      - '-docker_only=true'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    labels:
      traefik.enable: true
      traefik.http.services.cadvisor.loadbalancer.server.port: 8080
      traefik.http.routers.cadvisor.rule: PathPrefix(`/cadvisor`)
      traefik.http.routers.cadvisor.entrypoints: web
      traefik.http.routers.cadvisor.middlewares: cadvisor-stripprefix,cadvisor-ratelimit
      traefik.http.middlewares.cadvisor-stripprefix.stripprefix.prefixes: /cadvisor
      traefik.http.middlewares.cadvisor-ratelimit.ratelimit.average: 1
      traefik.http.middlewares.cadvisor-ratelimit.ratelimit.burst: 2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Optional (opt-in, see docs/virtual-mmu.md): keeps klipper reaching ready
  # when the Pico MMU is unplugged by pointing /run/klipper/mmu at a virtual MCU.
  # Enable with COMPOSE_PROFILES=mmu-fallback in .env (see .env.example).
  mmu-fallback:
    image: ghcr.io/destaben/klipper_ender3_v3_se/mmu-fallback:sha-44871ed
    build:
      context: .
      dockerfile: Dockerfile-mmu-fallback
    profiles: [mmu-fallback]
    restart: unless-stopped
    container_name: mmu-fallback
    user: "1000:1000"
    depends_on: [moonraker]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PRINTER_MODE: ${PRINTER_MODE:-real}
      ABSENT_DEBOUNCE: ${MMU_ABSENT_DEBOUNCE:-10}
      PRESENT_DEBOUNCE: ${MMU_PRESENT_DEBOUNCE:-3}
      RESTART_COOLDOWN: ${MMU_RESTART_COOLDOWN:-60}
      QUIET_AFTER_RESTART: ${MMU_QUIET_AFTER_RESTART:-20}
      STARTUP_GRACE: ${MMU_STARTUP_GRACE:-5}
      RESPAWN_GRACE: ${MMU_RESPAWN_GRACE:-15}
    volumes:
      # Same path in both containers: the links it writes are absolute
      - ${MMU_LINK_DIR:-./serial-links}:/run/klipper
      # Read-only host /dev: only to check that the Pico's /dev/serial/by-id
      # entry exists (it links to ../../ttyACMn, so the whole tree is needed).
      # The virtual MCU's pty is created by mmu-virtual, not here.
      - /dev:/dev:ro
    healthcheck:
      # The link must exist before Klippy connects. In real mode it may dangle
      # (Pico unplugged, same as without this service), and that must not block
      # `docker compose up`; otherwise the target (the virtual pty) must exist.
      # The same goes for a set print latch: the link deliberately dangles at
      # the absent real Pico instead of becoming virtual mid-print.
      test:
        - CMD-SHELL
        - >-
          test -L /run/klipper/mmu &&
          { [ "$$PRINTER_MODE" = real ] || test -e /run/klipper/mmu ||
          test -e /run/klipper/print_latch; }
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # The virtual Pico MMU itself, kept apart from the watcher so that recreating
  # or restarting mmu-fallback does not kill the MCU Klippy is connected to.
  # Idle unless PRINTER_MODE is auto or sim. Same image as mmu-fallback.
  mmu-virtual:
    image: ghcr.io/destaben/klipper_ender3_v3_se/mmu-fallback:sha-44871ed
    profiles: [mmu-fallback]
    restart: unless-stopped
    container_name: mmu-virtual
    user: "1000:1000"
    command: ["/opt/mmu-fallback/run_virtual.sh"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PRINTER_MODE: ${PRINTER_MODE:-real}
    volumes:
      - ${MMU_LINK_DIR:-./serial-links}:/run/klipper
      # Host /dev: the pty must come from the host devpts so that the klipper
      # container (which also mounts /dev) can open it. Only /dev/pts and
      # /dev/ptmx may be enough; that needs a test on the printer
      # (docs/virtual-mmu.md, "To verify"). The container is unprivileged, has no
      # capabilities and cannot create device nodes.
      - /dev:/dev
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  # tmpfs for the MMU serial links (MMU_LINK_DIR=mmu-links in .env.example).
  # Docker mounts it when the first container that uses it starts, so it exists
  # after every reboot without a host directory or sudo. It is empty again after
  # the last of klipper, mmu-fallback and mmu-virtual stops, like any tmpfs.
  mmu-links:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=1000,gid=1000,mode=0755
